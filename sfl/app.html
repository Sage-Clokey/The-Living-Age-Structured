<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFL Outreach Pipeline — California</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── */
:root {
  --bg: #07090a;
  --bg2: #0c0f0c;
  --bg3: #0c1008;
  --text: #ddd9cc;
  --dim: #6a6860;
  --green: #7a9e7e;
  --gold: #b8973a;
  --flame: #4aaa5a;
  --red: #9e5a4a;
  --line: rgba(255,255,255,0.07);
  --font-heading: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Jost', 'Helvetica Neue', system-ui, sans-serif;
  --font-mono: 'Courier New', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 300;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── TOP BAR ── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: rgba(7,9,10,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.topbar-title {
  font-family: var(--font-heading);
  font-size: 1.1rem;
  font-weight: 400;
  color: var(--green);
  letter-spacing: 1px;
}

.tabs {
  display: flex;
  gap: 4px;
}

.tab {
  background: none;
  border: 1px solid transparent;
  color: var(--dim);
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-weight: 400;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}

.tab:hover { color: var(--text); }
.tab.active { color: var(--text); background: var(--bg2); border-color: var(--line); }

/* ── STAT BAR ── */
.stat-bar {
  display: flex;
  gap: 16px;
  padding: 8px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  font-size: 0.75rem;
  letter-spacing: 0.5px;
  flex-wrap: wrap;
}

.stat { color: var(--dim); }
.stat b { color: var(--text); font-weight: 400; }
.stat.warn b { color: var(--gold); }
.stat.danger b { color: var(--red); }

/* ── VIEWS ── */
.view { display: none; padding: 16px 20px; }
.view.active { display: block; }

/* ── PIPELINE BOARD ── */
.pipeline {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  min-height: calc(100vh - 140px);
}

.column {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  min-height: 200px;
}

.col-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.col-title {
  font-family: var(--font-heading);
  font-size: 0.95rem;
  font-weight: 400;
  color: var(--text);
}

.col-count {
  font-size: 0.7rem;
  color: var(--dim);
  font-family: var(--font-mono);
}

.col-count.warn { color: var(--gold); }
.col-count.danger { color: var(--red); font-weight: 500; }

.col-cards {
  padding: 8px;
  flex: 1;
  overflow-y: auto;
  min-height: 60px;
}

.col-cards.drag-over {
  background: rgba(122,158,126,0.06);
}

/* ── CARDS ── */
.card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: grab;
  transition: border-color 0.2s, transform 0.15s;
  position: relative;
}

.card:active { cursor: grabbing; }
.card:hover { border-color: var(--green); }
.card.dragging { opacity: 0.4; transform: scale(0.96); }

.card-name {
  font-weight: 400;
  font-size: 0.9rem;
  margin-bottom: 2px;
}

.card-campus {
  font-size: 0.75rem;
  color: var(--dim);
}

.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  font-size: 0.68rem;
  color: var(--dim);
}

.card-priority {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}

.card-priority.H { background: var(--red); }
.card-priority.M { background: var(--gold); }
.card-priority.L { background: var(--dim); }

.card-overdue { color: var(--red); font-weight: 500; }

.card-actions {
  position: absolute;
  top: 6px;
  right: 6px;
  display: none;
  gap: 4px;
}

.card:hover .card-actions { display: flex; }

.card-btn {
  background: none;
  border: none;
  color: var(--dim);
  font-size: 0.75rem;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 2px;
}

.card-btn:hover { color: var(--text); background: var(--line); }

/* ── QUICK ACTION LINKS (call/text/email) ── */
.card-quick {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}

.quick-link {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 8px;
  border-radius: 3px;
  font-size: 0.7rem;
  font-family: var(--font-body);
  text-decoration: none;
  color: var(--dim);
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  transition: all 0.2s;
  cursor: pointer;
}

.quick-link:hover { color: var(--text); border-color: var(--green); }
.quick-link.ql-call:hover { color: var(--flame); border-color: var(--flame); }
.quick-link.ql-text:hover { color: var(--green); border-color: var(--green); }
.quick-link.ql-email:hover { color: var(--gold); border-color: var(--gold); }

.modal-actions-bar {
  display: flex;
  gap: 8px;
  padding: 12px 0;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}

.action-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 16px;
  border-radius: 4px;
  font-size: 0.85rem;
  font-family: var(--font-body);
  text-decoration: none;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  transition: all 0.2s;
  cursor: pointer;
}

.action-link:hover { border-color: var(--green); }
.action-link.al-call { color: var(--flame); }
.action-link.al-call:hover { background: var(--flame); color: var(--bg); border-color: var(--flame); }
.action-link.al-text { color: var(--green); }
.action-link.al-text:hover { background: var(--green); color: var(--bg); border-color: var(--green); }
.action-link.al-email { color: var(--gold); }
.action-link.al-email:hover { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.action-link.al-disabled { opacity: 0.3; pointer-events: none; }

/* ── ADD CONTACT BUTTON ── */
.add-btn {
  display: block;
  width: 100%;
  padding: 8px;
  margin-top: 4px;
  background: none;
  border: 1px dashed var(--line);
  border-radius: 4px;
  color: var(--dim);
  font-family: var(--font-body);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}

.add-btn:hover { border-color: var(--green); color: var(--green); }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 16px;
  overflow-y: auto;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 8px;
  width: 100%;
  max-width: 520px;
  padding: 24px;
}

.modal h2 {
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 1.3rem;
  margin-bottom: 16px;
  color: var(--green);
}

.form-row {
  margin-bottom: 12px;
}

.form-row label {
  display: block;
  font-size: 0.75rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.form-row input,
.form-row select,
.form-row textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9rem;
  padding: 8px 10px;
}

.form-row textarea { resize: vertical; min-height: 60px; }
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {
  outline: none;
  border-color: var(--green);
}

.form-row-inline {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-row {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}

.btn {
  font-family: var(--font-body);
  font-size: 0.85rem;
  padding: 8px 18px;
  border-radius: 4px;
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--flame);
  color: var(--bg);
  border-color: var(--flame);
  font-weight: 500;
}

.btn-primary:hover { opacity: 0.85; }

.btn-ghost {
  background: none;
  color: var(--dim);
}

.btn-ghost:hover { color: var(--text); }

.btn-danger {
  background: none;
  color: var(--red);
  border-color: var(--red);
}

.btn-danger:hover { background: var(--red); color: var(--bg); }

/* ── CONTACT DETAIL ── */
.contact-history {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}

.contact-history h3 {
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 1rem;
  color: var(--dim);
  margin-bottom: 8px;
}

.history-item {
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.82rem;
}

.history-item:last-child { border-bottom: none; }

.history-date { color: var(--dim); font-family: var(--font-mono); font-size: 0.72rem; }
.history-channel { color: var(--gold); }
.history-dir { color: var(--dim); }

/* ── MOVE MENU ── */
.move-menu {
  position: absolute;
  top: 100%;
  right: 0;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 4px 0;
  z-index: 50;
  min-width: 160px;
  display: none;
}

.move-menu.open { display: block; }

.move-option {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.8rem;
  padding: 6px 12px;
  cursor: pointer;
  text-align: left;
}

.move-option:hover { background: var(--line); }
.move-option.current { color: var(--dim); cursor: default; }

/* ── LOG VIEW ── */
.log-form {
  display: grid;
  grid-template-columns: 120px 1fr 100px 70px 1fr 1fr auto;
  gap: 8px;
  align-items: end;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.log-form label {
  font-size: 0.68rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.log-form input,
.log-form select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.82rem;
  padding: 6px 8px;
}

.log-form input:focus,
.log-form select:focus {
  outline: none;
  border-color: var(--green);
}

.log-entries { max-width: 900px; }

.log-entry {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: 90px 140px 80px 40px 1fr;
  gap: 12px;
  font-size: 0.85rem;
  align-items: baseline;
}

.log-entry .le-date { color: var(--dim); font-family: var(--font-mono); font-size: 0.75rem; }
.log-entry .le-name { color: var(--text); font-weight: 400; }
.log-entry .le-channel { color: var(--gold); font-size: 0.78rem; }
.log-entry .le-dir { color: var(--dim); font-size: 0.78rem; }
.log-entry .le-summary { color: var(--text); }
.log-entry .le-next { color: var(--green); font-size: 0.78rem; margin-top: 2px; }

.log-filter {
  margin-bottom: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.log-filter label { font-size: 0.75rem; color: var(--dim); }

.log-filter select {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.82rem;
  padding: 4px 8px;
}

/* ── RHYTHM VIEW ── */
.rhythm-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.rhythm-day {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
}

.rhythm-day h3 {
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 1rem;
  color: var(--green);
  margin-bottom: 10px;
}

.rhythm-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 0.85rem;
}

.rhythm-check input[type="checkbox"] {
  accent-color: var(--flame);
  width: 16px;
  height: 16px;
}

.rhythm-check.done label { color: var(--dim); text-decoration: line-through; }

.rhythm-section {
  margin-bottom: 24px;
}

.rhythm-section h3 {
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 1.1rem;
  color: var(--text);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}

.overdue-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.overdue-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--red);
  border-radius: 4px;
  font-size: 0.85rem;
}

.overdue-item .days { color: var(--red); font-size: 0.78rem; }

.wed-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.wed-action {
  display: flex;
  gap: 8px;
  align-items: center;
}

.wed-action input[type="checkbox"] {
  accent-color: var(--flame);
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.wed-action input[type="text"] {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.85rem;
  padding: 6px 8px;
}

.wed-action input[type="text"]:focus {
  outline: none;
  border-color: var(--green);
}

.wed-action .remove-action {
  background: none;
  border: none;
  color: var(--dim);
  cursor: pointer;
  font-size: 1rem;
  padding: 0 4px;
}

.wed-action .remove-action:hover { color: var(--red); }

.pipeline-summary {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}

.summary-card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 12px;
  text-align: center;
}

.summary-card .count {
  font-family: var(--font-heading);
  font-size: 1.5rem;
  color: var(--text);
}

.summary-card .label {
  font-size: 0.7rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── DATA MGMT ── */
.data-section {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* ── AUTOCOMPLETE ── */
.autocomplete-wrap { position: relative; }

.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 0 0 4px 4px;
  max-height: 150px;
  overflow-y: auto;
  z-index: 50;
  display: none;
}

.autocomplete-list.open { display: block; }

.autocomplete-option {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.82rem;
  padding: 6px 10px;
  cursor: pointer;
  text-align: left;
}

.autocomplete-option:hover { background: var(--line); }

/* ── MOBILE ── */
@media (max-width: 900px) {
  .pipeline {
    grid-template-columns: 1fr;
  }

  .column { min-height: 100px; }

  .log-form {
    grid-template-columns: 1fr 1fr;
  }

  .log-entry {
    grid-template-columns: 1fr;
    gap: 2px;
  }

  .rhythm-grid {
    grid-template-columns: 1fr;
  }

  .pipeline-summary {
    grid-template-columns: repeat(3, 1fr);
  }

  .topbar {
    flex-direction: column;
    gap: 8px;
  }

  .form-row-inline {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 500px) {
  .tabs { gap: 2px; }
  .tab { padding: 5px 8px; font-size: 0.7rem; }
  .pipeline-summary { grid-template-columns: repeat(2, 1fr); }
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
</style>
</head>
<body>

<!-- ── TOP BAR ── -->
<header class="topbar">
  <div class="topbar-title">SFL California Pipeline</div>
  <div class="tabs">
    <button class="tab active" data-view="pipeline">Pipeline</button>
    <button class="tab" data-view="log">Log</button>
    <button class="tab" data-view="rhythm">Rhythm</button>
  </div>
</header>

<!-- ── STAT BAR ── -->
<div class="stat-bar" id="statBar"></div>

<!-- ══════════ PIPELINE VIEW ══════════ -->
<section class="view active" id="view-pipeline">
  <div class="pipeline" id="pipelineBoard">
    <div class="column" data-stage="queue">
      <div class="col-header">
        <span class="col-title">Queue</span>
        <span class="col-count" id="count-queue">0</span>
      </div>
      <div class="col-cards" data-stage="queue"></div>
      <button class="add-btn" onclick="openContactModal('queue')">+ Add</button>
    </div>
    <div class="column" data-stage="reaching">
      <div class="col-header">
        <span class="col-title">Reaching Out</span>
        <span class="col-count" id="count-reaching">0/10</span>
      </div>
      <div class="col-cards" data-stage="reaching"></div>
    </div>
    <div class="column" data-stage="conversation">
      <div class="col-header">
        <span class="col-title">In Conversation</span>
        <span class="col-count" id="count-conversation">0</span>
      </div>
      <div class="col-cards" data-stage="conversation"></div>
    </div>
    <div class="column" data-stage="active">
      <div class="col-header">
        <span class="col-title">Active</span>
        <span class="col-count" id="count-active">0</span>
      </div>
      <div class="col-cards" data-stage="active"></div>
    </div>
    <div class="column" data-stage="lc">
      <div class="col-header">
        <span class="col-title">LC</span>
        <span class="col-count" id="count-lc">0</span>
      </div>
      <div class="col-cards" data-stage="lc"></div>
    </div>
    <div class="column" data-stage="dormant">
      <div class="col-header">
        <span class="col-title">Dormant</span>
        <span class="col-count" id="count-dormant">0</span>
      </div>
      <div class="col-cards" data-stage="dormant"></div>
    </div>
  </div>
</section>

<!-- ══════════ LOG VIEW ══════════ -->
<section class="view" id="view-log">
  <form class="log-form" id="logForm" onsubmit="return addLogEntry(event)">
    <div>
      <label>Date</label>
      <input type="date" id="logDate">
    </div>
    <div class="autocomplete-wrap">
      <label>Contact</label>
      <input type="text" id="logContact" placeholder="Name..." autocomplete="off">
      <input type="hidden" id="logContactId">
      <div class="autocomplete-list" id="logAutocomplete"></div>
    </div>
    <div>
      <label>Channel</label>
      <select id="logChannel">
        <option value="phone">Phone</option>
        <option value="dm">DM</option>
        <option value="email">Email</option>
        <option value="in-person">In Person</option>
      </select>
    </div>
    <div>
      <label>Dir</label>
      <select id="logDirection">
        <option value="out">&rarr;</option>

    </div>

      <button type="button" class="btn btn-danger" id="deleteContactBtn" style="display:none;margin-right:auto;" onclick="deleteContact()">Delete</button>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// DATA LAYER
// ══════════════════════════════════════════════════════════════════════════════

const STAGES = ['queue','reaching','conversation','active','lc','dormant'];
const STAGE_LABELS = {queue:'Queue',reaching:'Reaching Out',conversation:'In Conversation',active:'Active',lc:'LC',dormant:'Dormant'};
const REACHING_CAP = 10;
const WORKLOAD_CAP = 18;

function uuid() {
  return crypto.randomUUID ? crypto.randomUUID() : 'xxxx-xxxx-xxxx'.replace(/x/g, () => Math.floor(Math.random()*16).toString(16));
}

function today() { return new Date().toISOString().split('T')[0]; }

function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff);
  return dt.toISOString().split('T')[0];
}

function loadData() {
  const raw = localStorage.getItem('sfl_pipeline');
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return { contacts: [], log: [], weeklyActions: [], rhythmChecks: {} };
}

function saveData(data) {
  localStorage.setItem('sfl_pipeline', JSON.stringify(data));
}

let DATA = loadData();

// ══════════════════════════════════════════════════════════════════════════════
// TAB NAVIGATION
// ══════════════════════════════════════════════════════════════════════════════

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
    if (tab.dataset.view === 'log') renderLog();
    if (tab.dataset.view === 'rhythm') renderRhythm();
  });
});

// ══════════════════════════════════════════════════════════════════════════════
// STAT BAR
// ══════════════════════════════════════════════════════════════════════════════

function renderStats() {
  const counts = {};
  STAGES.forEach(s => counts[s] = 0);
  DATA.contacts.forEach(c => counts[c.stage] = (counts[c.stage]||0) + 1);

  const reaching = counts.reaching || 0;
  const workload = reaching + (counts.conversation || 0);
  const total = DATA.contacts.length;

  let reachClass = reaching >= REACHING_CAP ? 'danger' : reaching >= 8 ? 'warn' : '';
  let workClass = workload >= WORKLOAD_CAP ? 'danger' : workload >= 15 ? 'warn' : '';

  document.getElementById('statBar').innerHTML =
    `<span class="stat">Total: <b>${total}</b></span>` +
    `<span class="stat ${reachClass}">Reaching Out: <b>${reaching}/${REACHING_CAP}</b></span>` +
    `<span class="stat ${workClass}">Active Workload: <b>${workload}/${WORKLOAD_CAP}</b></span>` +
    `<span class="stat">LCs: <b>${counts.lc||0}</b></span>`;

  // Column counts
  STAGES.forEach(s => {
    const el = document.getElementById('count-' + s);
    if (!el) return;
    const n = counts[s] || 0;
    if (s === 'reaching') {
      el.textContent = n + '/' + REACHING_CAP;
      el.className = 'col-count' + (n >= REACHING_CAP ? ' danger' : n >= 8 ? ' warn' : '');
    } else {
      el.textContent = n;
    }
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// PIPELINE BOARD
// ══════════════════════════════════════════════════════════════════════════════

function daysSince(dateStr) {
  if (!dateStr) return null;
  const diff = Date.now() - new Date(dateStr).getTime();
  return Math.floor(diff / 86400000);
}

function renderCard(contact) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.id = contact.id;

  const days = daysSince(contact.lastContact);
  const overdue = contact.stage === 'conversation' && days !== null && days > 7;

  const hasPhone = contact.phone && contact.phone.trim();
  const hasEmail = contact.email && contact.email.trim();
  const phoneClean = hasPhone ? contact.phone.replace(/[^+\d]/g, '') : '';

  let quickHtml = '';
  if (hasPhone || hasEmail) {
    quickHtml = '<div class="card-quick">';
    if (hasPhone) {
      quickHtml += `<a class="quick-link ql-call" href="tel:${esc(phoneClean)}" onclick="event.stopPropagation();logQuickAction('${contact.id}','phone','out','Called')" title="Call">&#9742; Call</a>`;
      quickHtml += `<a class="quick-link ql-text" href="sms:${esc(phoneClean)}" onclick="event.stopPropagation();logQuickAction('${contact.id}','dm','out','Texted')" title="Text">&#9993; Text</a>`;
    }
    if (hasEmail) {
      quickHtml += `<a class="quick-link ql-email" href="mailto:${esc(contact.email)}" onclick="event.stopPropagation();logQuickAction('${contact.id}','email','out','Emailed')" title="Email">&#9993; Email</a>`;
    }
    quickHtml += '</div>';
  }

  card.innerHTML =
    `<div class="card-actions">
      <button class="card-btn" onclick="event.stopPropagation();openMoveMenu('${contact.id}',this)" title="Move">&#8644;</button>
    </div>
    <div class="card-name"><span class="card-priority ${contact.priority}"></span>${esc(contact.name)}</div>
    <div class="card-campus">${esc(contact.campus || '—')}</div>
    ${quickHtml}
    <div class="card-meta">
      <span>${contact.lastContact ? contact.lastContact : 'No contact'}</span>
      <span>${overdue ? '<span class="card-overdue">' + days + 'd overdue</span>' : (contact.nextAction ? esc(contact.nextAction).substring(0,20) : '')}</span>
    </div>`;

  // Click to edit
  card.addEventListener('click', (e) => {
    if (e.target.closest('.card-btn') || e.target.closest('.move-menu')) return;
    openContactModal(contact.stage, contact.id);
  });

  // Drag events
  card.addEventListener('dragstart', (e) => {
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', contact.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  return card;
}

function renderPipeline() {
  STAGES.forEach(stage => {
    const container = document.querySelector(`.col-cards[data-stage="${stage}"]`);
    container.innerHTML = '';
    const contacts = DATA.contacts.filter(c => c.stage === stage);

    // Sort: H first, then M, then L
    const pOrder = {H:0, M:1, L:2};
    contacts.sort((a,b) => (pOrder[a.priority]||1) - (pOrder[b.priority]||1));

    contacts.forEach(c => container.appendChild(renderCard(c)));
  });
  renderStats();
}

// Drag and drop on columns
document.querySelectorAll('.col-cards').forEach(col => {
  col.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('drag-over');
  });
  col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
  col.addEventListener('drop', (e) => {
    e.preventDefault();
    col.classList.remove('drag-over');
    const id = e.dataTransfer.getData('text/plain');
    const targetStage = col.dataset.stage;
    moveContact(id, targetStage);
  });
});

function moveContact(id, targetStage) {
  const contact = DATA.contacts.find(c => c.id === id);
  if (!contact || contact.stage === targetStage) return;

  // Enforce reaching cap
  if (targetStage === 'reaching') {
    const reachCount = DATA.contacts.filter(c => c.stage === 'reaching').length;
    if (reachCount >= REACHING_CAP) {
      alert('Reaching Out is at capacity (' + REACHING_CAP + '). Move someone forward or to Dormant first.');
      return;
    }
  }

  contact.stage = targetStage;
  saveData(DATA);
  renderPipeline();
}

// Move menu (tap-to-move for mobile)
let activeMoveMenu = null;

function openMoveMenu(contactId, btn) {
  closeMoveMenu();
  const contact = DATA.contacts.find(c => c.id === contactId);
  if (!contact) return;

  const menu = document.createElement('div');
  menu.className = 'move-menu open';

  STAGES.forEach(stage => {
    const opt = document.createElement('button');
    opt.className = 'move-option' + (stage === contact.stage ? ' current' : '');
    opt.textContent = STAGE_LABELS[stage];
    if (stage !== contact.stage) {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        moveContact(contactId, stage);
        closeMoveMenu();
      });
    }
    menu.appendChild(opt);
  });

  btn.parentElement.style.position = 'relative';
  btn.parentElement.appendChild(menu);
  activeMoveMenu = menu;

  setTimeout(() => document.addEventListener('click', closeMoveMenu, {once:true}), 10);
}

function closeMoveMenu() {
  if (activeMoveMenu) {
    activeMoveMenu.remove();
    activeMoveMenu = null;
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// CONTACT MODAL
// ══════════════════════════════════════════════════════════════════════════════

function openContactModal(stage, contactId) {
  const modal = document.getElementById('contactModal');
  const isEdit = !!contactId;
  const contact = isEdit ? DATA.contacts.find(c => c.id === contactId) : null;

  document.getElementById('modalTitle').textContent = isEdit ? 'Edit Contact' : 'New Contact';
  document.getElementById('editContactId').value = isEdit ? contactId : '';
  document.getElementById('editContactStage').value = stage || 'queue';
  document.getElementById('deleteContactBtn').style.display = isEdit ? 'inline-block' : 'none';

  // Build action bar (call / text / email buttons)
  const actionsBar = document.getElementById('modalActionsBar');
  if (isEdit && contact) {
    const hasPhone = contact.phone && contact.phone.trim();
    const hasEmail = contact.email && contact.email.trim();
    const phoneClean = hasPhone ? contact.phone.replace(/[^+\d]/g, '') : '';

    if (hasPhone || hasEmail) {
      let html = '';
      if (hasPhone) {
        html += `<a class="action-link al-call" href="tel:${esc(phoneClean)}" onclick="logQuickAction('${contact.id}','phone','out','Called')">&#9742; Call</a>`;
        html += `<a class="action-link al-text" href="sms:${esc(phoneClean)}" onclick="logQuickAction('${contact.id}','dm','out','Texted')">&#9993; Text</a>`;
      } else {
        html += `<span class="action-link al-disabled">&#9742; Call (no phone)</span>`;
        html += `<span class="action-link al-disabled">&#9993; Text (no phone)</span>`;
      }
      if (hasEmail) {
        html += `<a class="action-link al-email" href="mailto:${esc(contact.email)}" onclick="logQuickAction('${contact.id}','email','out','Emailed')">&#9993; Email</a>`;
      } else {
        html += `<span class="action-link al-disabled">&#9993; Email (no email)</span>`;
      }
      actionsBar.innerHTML = html;
      actionsBar.style.display = 'flex';
    } else {
      actionsBar.innerHTML = '<span style="color:var(--dim);font-size:0.8rem;">Add phone or email to enable quick actions</span>';
      actionsBar.style.display = 'flex';
    }
  } else {
    actionsBar.style.display = 'none';
  }

  document.getElementById('cName').value = contact ? contact.name : '';
  document.getElementById('cCampus').value = contact ? contact.campus : '';
  document.getElementById('cRegion').value = contact ? contact.region : '';
  document.getElementById('cSource').value = contact ? contact.source : 'sfl';
  document.getElementById('cPhone').value = contact ? contact.phone : '';
  document.getElementById('cEmail').value = contact ? contact.email : '';
  document.getElementById('cSocial').value = contact ? contact.social : '';
  document.getElementById('cPriority').value = contact ? contact.priority : 'M';
  document.getElementById('cVibe').value = contact ? contact.vibeCheck : '';
  document.getElementById('cNextAction').value = contact ? contact.nextAction : '';
  document.getElementById('cNextActionBy').value = contact ? contact.nextActionBy || '' : '';
  document.getElementById('cNotes').value = contact ? contact.notes : '';

  // Show history if editing
  const historySection = document.getElementById('contactHistory');
  const historyEntries = document.getElementById('contactHistoryEntries');
  if (isEdit) {
    const entries = DATA.log.filter(l => l.contactId === contactId).sort((a,b) => b.date.localeCompare(a.date));
    if (entries.length > 0) {
      historySection.style.display = 'block';
      historyEntries.innerHTML = entries.map(e =>
        `<div class="history-item">
          <span class="history-date">${e.date}</span>
          <span class="history-channel">${e.channel}</span>
          <span class="history-dir">${e.direction === 'out' ? '→' : '←'}</span>
          ${esc(e.summary)}
          ${e.nextStep ? '<br><span style="color:var(--green);font-size:0.75rem;">Next: ' + esc(e.nextStep) + '</span>' : ''}
        </div>`
      ).join('');
    } else {
      historySection.style.display = 'block';
      historyEntries.innerHTML = '<p style="color:var(--dim);font-size:0.82rem;">No log entries yet.</p>';
    }
  } else {
    historySection.style.display = 'none';
  }

  modal.classList.add('open');
}

function closeContactModal() {
  document.getElementById('contactModal').classList.remove('open');
}

function saveContact() {
  const name = document.getElementById('cName').value.trim();
  if (!name) { alert('Name is required.'); return; }

  const id = document.getElementById('editContactId').value;
  const stage = document.getElementById('editContactStage').value;
  const isEdit = !!id;

  const fields = {
    name,
    campus: document.getElementById('cCampus').value.trim(),
    region: document.getElementById('cRegion').value,
    source: document.getElementById('cSource').value,
    phone: document.getElementById('cPhone').value.trim(),
    email: document.getElementById('cEmail').value.trim(),
    social: document.getElementById('cSocial').value.trim(),
    priority: document.getElementById('cPriority').value,
    vibeCheck: document.getElementById('cVibe').value,
    nextAction: document.getElementById('cNextAction').value.trim(),
    nextActionBy: document.getElementById('cNextActionBy').value || null,
    notes: document.getElementById('cNotes').value.trim(),
  };

  if (isEdit) {
    const contact = DATA.contacts.find(c => c.id === id);
    if (contact) Object.assign(contact, fields);
  } else {
    // Check reaching cap
    if (stage === 'reaching') {
      const reachCount = DATA.contacts.filter(c => c.stage === 'reaching').length;
      if (reachCount >= REACHING_CAP) {
        alert('Reaching Out is at capacity (' + REACHING_CAP + '). Add to Queue instead.');
        return;
      }
    }
    DATA.contacts.push({
      id: uuid(),
      ...fields,
      stage: stage || 'queue',
      createdAt: today(),
      lastContact: null,
    });
  }

  saveData(DATA);
  renderPipeline();
  closeContactModal();
}

function deleteContact() {
  const id = document.getElementById('editContactId').value;
  if (!id) return;
  if (!confirm('Delete this contact? This cannot be undone.')) return;
  DATA.contacts = DATA.contacts.filter(c => c.id !== id);
  DATA.log = DATA.log.filter(l => l.contactId !== id);
  saveData(DATA);
  renderPipeline();
  closeContactModal();
}

// Quick action — auto-logs a call/text/email when tapped from card or modal
function logQuickAction(contactId, channel, direction, summary) {
  const contact = DATA.contacts.find(c => c.id === contactId);
  if (!contact) return;
  const d = today();
  DATA.log.push({
    id: uuid(),
    date: d,
    contactId: contactId,
    contactName: contact.name,
    channel: channel,
    direction: direction,
    summary: summary,
    nextStep: '',
  });
  if (!contact.lastContact || d >= contact.lastContact) {
    contact.lastContact = d;
  }
  saveData(DATA);
  renderPipeline();
}

// Close modal on overlay click
document.getElementById('contactModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeContactModal();
});

// ══════════════════════════════════════════════════════════════════════════════
// CONTACT LOG
// ══════════════════════════════════════════════════════════════════════════════

// Set default date
document.getElementById('logDate').value = today();

// Autocomplete
const logContactInput = document.getElementById('logContact');
const logContactIdInput = document.getElementById('logContactId');
const logAutocomplete = document.getElementById('logAutocomplete');

logContactInput.addEventListener('input', () => {
  const val = logContactInput.value.toLowerCase().trim();
  logContactIdInput.value = '';
  if (!val) { logAutocomplete.classList.remove('open'); return; }

  const matches = DATA.contacts.filter(c => c.name.toLowerCase().includes(val)).slice(0, 8);
  if (matches.length === 0) { logAutocomplete.classList.remove('open'); return; }

  logAutocomplete.innerHTML = matches.map(c =>
    `<button type="button" class="autocomplete-option" data-id="${c.id}">${esc(c.name)} <span style="color:var(--dim);font-size:0.7rem;">${esc(c.campus||'')}</span></button>`
  ).join('');

  logAutocomplete.querySelectorAll('.autocomplete-option').forEach(btn => {
    btn.addEventListener('click', () => {
      logContactInput.value = btn.textContent.trim().split('  ')[0];
      logContactIdInput.value = btn.dataset.id;
      logAutocomplete.classList.remove('open');
    });
  });

  logAutocomplete.classList.add('open');
});

logContactInput.addEventListener('blur', () => {
  setTimeout(() => logAutocomplete.classList.remove('open'), 150);
});

function addLogEntry(e) {
  e.preventDefault();
  const contactId = logContactIdInput.value;
  const contactName = logContactInput.value.trim();
  if (!contactName) { alert('Select a contact.'); return; }

  // If no matching contact ID, try exact match
  let resolvedId = contactId;
  if (!resolvedId) {
    const match = DATA.contacts.find(c => c.name.toLowerCase() === contactName.toLowerCase());
    if (match) resolvedId = match.id;
  }

  const entry = {
    id: uuid(),
    date: document.getElementById('logDate').value || today(),
    contactId: resolvedId || null,
    contactName: contactName,
    channel: document.getElementById('logChannel').value,
    direction: document.getElementById('logDirection').value,
    summary: document.getElementById('logSummary').value.trim(),
    nextStep: document.getElementById('logNextStep').value.trim(),
  };

  DATA.log.push(entry);

  // Update contact's lastContact
  if (resolvedId) {
    const contact = DATA.contacts.find(c => c.id === resolvedId);
    if (contact) {
      if (!contact.lastContact || entry.date >= contact.lastContact) {
        contact.lastContact = entry.date;
      }
    }
  }

  saveData(DATA);

  // Reset form
  logContactInput.value = '';
  logContactIdInput.value = '';
  document.getElementById('logSummary').value = '';
  document.getElementById('logNextStep').value = '';
  document.getElementById('logDate').value = today();

  renderLog();
  renderPipeline();
}

function renderLog() {
  const filter = document.getElementById('logFilterPerson').value;
  let entries = [...DATA.log].sort((a,b) => b.date.localeCompare(a.date));

  if (filter) {
    entries = entries.filter(e => e.contactId === filter);
  }

  // Update filter dropdown
  const filterEl = document.getElementById('logFilterPerson');
  const currentVal = filterEl.value;
  const contactsWithLogs = [...new Set(DATA.log.map(l => l.contactId).filter(Boolean))];
  filterEl.innerHTML = '<option value="">All contacts</option>' +
    contactsWithLogs.map(id => {
      const c = DATA.contacts.find(ct => ct.id === id);
      const name = c ? c.name : 'Unknown';
      return `<option value="${id}"${id === currentVal ? ' selected' : ''}>${esc(name)}</option>`;
    }).join('');

  const container = document.getElementById('logEntries');
  if (entries.length === 0) {
    container.innerHTML = '<p style="color:var(--dim);font-size:0.85rem;padding:20px 0;">No log entries yet.</p>';
    return;
  }

  container.innerHTML = entries.map(e => {
    const c = e.contactId ? DATA.contacts.find(ct => ct.id === e.contactId) : null;
    const name = c ? c.name : (e.contactName || 'Unknown');
    return `<div class="log-entry">
      <span class="le-date">${e.date}</span>
      <span class="le-name">${esc(name)}</span>
      <span class="le-channel">${e.channel}</span>
      <span class="le-dir">${e.direction === 'out' ? '→' : '←'}</span>
      <span>
        <span class="le-summary">${esc(e.summary)}</span>
        ${e.nextStep ? '<div class="le-next">→ ' + esc(e.nextStep) + '</div>' : ''}
      </span>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════════════════════
// WEEKLY RHYTHM
// ══════════════════════════════════════════════════════════════════════════════

function getCurrentWeek() { return getMonday(today()); }

function getRhythmChecks() {
  const week = getCurrentWeek();
  if (!DATA.rhythmChecks || DATA.rhythmChecks.weekOf !== week) {
    DATA.rhythmChecks = { weekOf: week, checks: {} };
    saveData(DATA);
  }
  return DATA.rhythmChecks;
}

function toggleRhythmCheck(key) {
  const rhythm = getRhythmChecks();
  rhythm.checks[key] = !rhythm.checks[key];
  saveData(DATA);
  renderRhythmChecks();
}

function renderRhythmChecks() {
  const rhythm = getRhythmChecks();
  document.querySelectorAll('.rhythm-check').forEach(el => {
    const key = el.dataset.check;
    const cb = el.querySelector('input[type="checkbox"]');
    const checked = rhythm.checks[key] || false;
    cb.checked = checked;
    el.classList.toggle('done', checked);
  });
}

function renderOverdue() {
  const container = document.getElementById('overdueList');
  const overdue = DATA.contacts
    .filter(c => c.stage === 'conversation' || c.stage === 'reaching')
    .filter(c => {
      const days = daysSince(c.lastContact);
      return days !== null && days > 7;
    })
    .map(c => ({ ...c, days: daysSince(c.lastContact) }))
    .sort((a,b) => b.days - a.days);

  if (overdue.length === 0) {
    container.innerHTML = '<p style="color:var(--dim);font-size:0.85rem;">No overdue contacts. You\'re on rhythm.</p>';
    return;
  }

  container.innerHTML = overdue.map(c =>
    `<div class="overdue-item">
      <span>${esc(c.name)} <span style="color:var(--dim);font-size:0.75rem;">${esc(c.campus||'')}</span></span>
      <span class="days">${c.days} days since last contact</span>
    </div>`
  ).join('');
}

function renderWedActions() {
  const week = getCurrentWeek();
  // Filter to current week
  const actions = (DATA.weeklyActions || []).filter(a => a.weekOf === week);
  const container = document.getElementById('wedActions');

  container.innerHTML = actions.map(a =>
    `<div class="wed-action">
      <input type="checkbox" ${a.done ? 'checked' : ''} onchange="toggleWedAction('${a.id}')">
      <input type="text" value="${esc(a.text)}" onchange="updateWedAction('${a.id}', this.value)" placeholder="Plan an action...">
      <button class="remove-action" onclick="removeWedAction('${a.id}')">&times;</button>
    </div>`
  ).join('');
}

function addWedAction() {
  if (!DATA.weeklyActions) DATA.weeklyActions = [];
  DATA.weeklyActions.push({ id: uuid(), text: '', done: false, weekOf: getCurrentWeek() });
  saveData(DATA);
  renderWedActions();
}

function toggleWedAction(id) {
  const a = DATA.weeklyActions.find(x => x.id === id);
  if (a) { a.done = !a.done; saveData(DATA); renderWedActions(); }
}

function updateWedAction(id, text) {
  const a = DATA.weeklyActions.find(x => x.id === id);
  if (a) { a.text = text; saveData(DATA); }
}

function removeWedAction(id) {
  DATA.weeklyActions = DATA.weeklyActions.filter(x => x.id !== id);
  saveData(DATA);
  renderWedActions();
}

function renderPipelineSummary() {
  const counts = {};
  STAGES.forEach(s => counts[s] = 0);
  DATA.contacts.forEach(c => counts[c.stage] = (counts[c.stage]||0) + 1);

  document.getElementById('pipelineSummary').innerHTML = STAGES.map(s =>
    `<div class="summary-card">
      <div class="count">${counts[s]}</div>
      <div class="label">${STAGE_LABELS[s]}</div>
    </div>`
  ).join('');
}

function renderRhythm() {
  renderRhythmChecks();
  renderOverdue();
  renderWedActions();
  renderPipelineSummary();
}

// ══════════════════════════════════════════════════════════════════════════════
// DATA EXPORT / IMPORT
// ══════════════════════════════════════════════════════════════════════════════

function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sfl-pipeline-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!imported.contacts || !imported.log) {
        alert('Invalid data file.');
        return;
      }
      if (!confirm('This will replace all current data. Continue?')) return;
      DATA = imported;
      if (!DATA.weeklyActions) DATA.weeklyActions = [];
      if (!DATA.rhythmChecks) DATA.rhythmChecks = {};
      saveData(DATA);
      renderPipeline();
      renderLog();
      renderRhythm();
      alert('Data imported successfully.');
    } catch(err) {
      alert('Error reading file: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ══════════════════════════════════════════════════════════════════════════════
// UTILITY
// ══════════════════════════════════════════════════════════════════════════════

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ══════════════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════════════

renderPipeline();
</script>
