<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clokey Productions Business Card</title>
<style>
  body {
    background: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Georgia', serif;
    gap: 3rem;
  }

  .label {
    color: #999;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: -2rem;
  }

  /* Standard business card: 3.5 x 2 inches at 300dpi = 1050x600, screen: 700x400 */
  .card {
    width: 700px;
    height: 400px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  /* === FRONT === */
  .front {
    background: radial-gradient(ellipse at 30% 50%, #1a0a2a 0%, #0f0820 30%, #0a0a0f 70%);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
  }

  .front .flame-area {
    width: 260px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Green Flame SVG */
  .green-flame {
    width: 260px;
    height: 340px;
    filter: drop-shadow(0 0 20px rgba(50, 205, 50, 0.4)) drop-shadow(0 0 40px rgba(50, 205, 50, 0.15));
    animation: flicker 3s ease-in-out infinite alternate;
  }

  @keyframes flicker {
    0% { filter: drop-shadow(0 0 25px rgba(50,205,50,0.5)) drop-shadow(0 0 50px rgba(50,205,50,0.2)) drop-shadow(0 0 80px rgba(50,205,50,0.1)); }
    33% { filter: drop-shadow(0 0 30px rgba(50,205,50,0.6)) drop-shadow(0 0 60px rgba(50,205,50,0.25)) drop-shadow(0 0 100px rgba(50,205,50,0.12)); }
    66% { filter: drop-shadow(0 0 22px rgba(50,205,50,0.45)) drop-shadow(0 0 45px rgba(50,205,50,0.18)) drop-shadow(0 0 75px rgba(50,205,50,0.08)); }
    100% { filter: drop-shadow(0 0 35px rgba(50,205,50,0.65)) drop-shadow(0 0 70px rgba(50,205,50,0.3)) drop-shadow(0 0 110px rgba(50,205,50,0.15)); }
  }

  .front .text-area {
    flex: 1;
    padding: 2.5rem 2.5rem 2.5rem 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .front .org-name {
    font-size: 1.6rem;
    color: #c9a84c;
    letter-spacing: 0.12em;
    font-weight: 400;
    margin-bottom: 0.15rem;
  }

  .front .org-sub {
    font-size: 0.72rem;
    color: #5a5545;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 1.8rem;
  }

  .front .person-name {
    font-size: 1.15rem;
    color: #d4c9a8;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .front .person-title {
    font-size: 0.78rem;
    color: #8a7e65;
    font-style: italic;
    margin-top: 0.15rem;
  }

  .front .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, #c9a84c, transparent);
    margin: 1.2rem 0;
  }

  .front .tagline {
    font-size: 0.95rem;
    color: #8a7e65;
    letter-spacing: 0.08em;
    line-height: 1.6;
    font-style: italic;
  }

  /* Subtle spiral watermark */
  .front::after {
    content: '';
    position: absolute;
    bottom: -60px;
    right: -60px;
    width: 200px;
    height: 200px;
    border: 1px solid rgba(201, 168, 76, 0.06);
    border-radius: 50%;
  }

  /* === BACK === */
  .back {
    background: radial-gradient(ellipse at 50% 30%, #1a0a2a 0%, #0f0820 30%, #0a0a0f 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem;
  }

  .back .contact-grid {
    width: 100%;
    max-width: 500px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    padding: 0.55rem 0;
    border-bottom: 1px solid #161411;
    gap: 0.8rem;
  }

  .contact-row:last-child { border-bottom: none; }

  .contact-icon {
    width: 28px;
    text-align: center;
    color: #c9a84c;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .contact-val {
    font-size: 0.82rem;
    color: #b8ad94;
    letter-spacing: 0.02em;
  }

  .back .mini-flame {
    width: 50px;
    height: 70px;
    margin-bottom: 1.2rem;
    filter: drop-shadow(0 0 12px rgba(50, 205, 50, 0.3));
  }

  .back .bottom-line {
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: #8a7e65;
    letter-spacing: 0.1em;
    font-style: italic;
  }

  @media print {
    body { background: white; }
    .label { display: none; }
    .card { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>
<body>

<p class="label">Front</p>
<div class="card front">
  <div class="flame-area">
    <svg class="green-flame" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Turbulence for organic flame edges -->
        <filter id="flameTurb" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="4" seed="3" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="1.5"/>
        </filter>
        <filter id="flameGlow">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="outerFlame" cx="50%" cy="85%" r="60%" fx="50%" fy="80%">
          <stop offset="0%" stop-color="#60e060" stop-opacity="1"/>
          <stop offset="30%" stop-color="#40c040" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="#2d8f2d" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#0d3d0d" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="midFlame" cx="50%" cy="80%" r="45%" fx="48%" fy="75%">
          <stop offset="0%" stop-color="#a0ffa0" stop-opacity="1"/>
          <stop offset="40%" stop-color="#50e050" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#2d8f2d" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="innerFlame" cx="50%" cy="75%" r="30%" fx="50%" fy="70%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="20%" stop-color="#e0ffe0" stop-opacity="0.95"/>
          <stop offset="50%" stop-color="#80ff80" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#50e050" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="baseGlow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#32cd32" stop-opacity="0"/>
          <stop offset="70%" stop-color="#1a6b1a" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.3"/>
        </linearGradient>
      </defs>

      <!-- Ambient glow -->
      <ellipse cx="100" cy="275" rx="70" ry="15" fill="#32cd32" opacity="0.08" filter="url(#flameGlow)"/>

      <!-- Outer flame body - wild organic shape -->
      <g filter="url(#flameTurb)">
        <path d="M100 15
          C92 45, 68 75, 55 105
          C42 135, 28 160, 25 185
          C22 210, 28 235, 38 252
          C48 268, 62 278, 78 284
          C88 288, 95 290, 100 290
          C105 290, 112 288, 122 284
          C138 278, 152 268, 162 252
          C172 235, 178 210, 175 185
          C172 160, 158 135, 145 105
          C132 75, 108 45, 100 15Z"
          fill="url(#outerFlame)" opacity="0.85"/>
      </g>

      <!-- Left lick -->
      <g filter="url(#flameTurb)">
        <path d="M72 100 C58 85, 48 72, 52 58 C55 48, 62 55, 65 68 C68 78, 70 90, 72 100Z"
          fill="#2d8f2d" opacity="0.5"/>
      </g>

      <!-- Right lick -->
      <g filter="url(#flameTurb)">
        <path d="M130 95 C138 78, 148 65, 145 52 C142 42, 135 50, 133 62 C131 74, 130 85, 130 95Z"
          fill="#2d8f2d" opacity="0.45"/>
      </g>

      <!-- Mid flame -->
      <g filter="url(#flameTurb)">
        <path d="M100 40
          C94 65, 78 95, 68 125
          C58 155, 48 180, 48 200
          C48 225, 58 250, 72 264
          C82 274, 92 280, 100 282
          C108 280, 118 274, 128 264
          C142 250, 152 225, 152 200
          C152 180, 142 155, 132 125
          C122 95, 106 65, 100 40Z"
          fill="url(#midFlame)" opacity="0.8"/>
      </g>

      <!-- Inner bright core -->
      <path d="M100 80
        C96 105, 82 135, 78 160
        C74 185, 76 210, 82 232
        C88 252, 95 262, 100 265
        C105 262, 112 252, 118 232
        C124 210, 126 185, 122 160
        C118 135, 104 105, 100 80Z"
        fill="url(#innerFlame)" opacity="0.75" filter="url(#flameGlow)"/>

      <!-- Hottest center wisp -->
      <path d="M100 140 C97 165, 88 190, 90 215 C92 235, 97 250, 100 258
        C103 250, 108 235, 110 215 C112 190, 103 165, 100 140Z"
        fill="white" opacity="0.35" filter="url(#flameGlow)"/>

      <!-- Fibonacci spiral overlay -->
      <g opacity="0.3" filter="url(#flameGlow)">
        <path d="
          M 100 220
          C 100 220, 85 220, 85 205
          C 85 190, 100 190, 100 190
          C 100 190, 120 190, 120 170
          C 120 150, 100 150, 100 150
          C 100 150, 68 150, 68 118
          C 68 86, 100 86, 100 86
          C 100 86, 148 86, 148 134
          C 148 170, 120 190, 100 220
        " fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <!-- Inner spiral turn -->
      <g opacity="0.2">
        <path d="
          M 100 220
          C 100 220, 92 218, 92 210
          C 92 202, 100 202, 100 202
          C 100 202, 110 202, 110 192
          C 110 182, 100 182, 100 182
        " fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" stroke-linecap="round"/>
      </g>

      <!-- Base ember -->
      <ellipse cx="100" cy="285" rx="45" ry="8" fill="url(#baseGlow)" opacity="0.7"/>
    </svg>
  </div>
  <div class="text-area">
    <div class="org-name">LIVING AGE</div>
    <div class="org-sub">Clokey Productions</div>
    <div class="person-name">Sage Clokey</div>
    <div class="person-title">Spiral Steward</div>
    <div class="divider"></div>
    <div class="tagline">Media to show why.<br>Technology to show how.</div>
  </div>
</div>

<p class="label">Back</p>
<div class="card back">
  <svg class="mini-flame" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="mt" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="3" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="8" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="1.2"/>
      </filter>
      <filter id="mg"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="mf1" cx="50%" cy="85%" r="55%">
        <stop offset="0%" stop-color="#40c040" stop-opacity="0.9"/>
        <stop offset="50%" stop-color="#1a6b1a" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#0d3d0d" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="mf2" cx="50%" cy="78%" r="35%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
        <stop offset="40%" stop-color="#90ee90" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#32cd32" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g filter="url(#mt)">
      <path d="M100 20 C90 55,65 95,50 140 C38 175,35 210,45 245 C55 268,75 282,100 288 C125 282,145 268,155 245 C165 210,162 175,150 140 C135 95,110 55,100 20Z" fill="url(#mf1)" opacity="0.85"/>
    </g>
    <path d="M100 80 C95 115,80 150,80 190 C80 225,90 255,100 265 C110 255,120 225,120 190 C120 150,105 115,100 80Z" fill="url(#mf2)" opacity="0.7" filter="url(#mg)"/>
  </svg>

  <div class="contact-grid">
    <div class="contact-row">
      <div class="contact-icon">tel</div>
      <div class="contact-val">805-459-2396</div>
    </div>
    <div class="contact-row">
      <div class="contact-icon">email</div>
      <div class="contact-val">clokeyd.sage@gmail.com</div>
    </div>
    <div class="contact-row">
      <div class="contact-icon">web</div>
      <div class="contact-val">sage-clokey.github.io</div>
    </div>
  </div>

  <div class="bottom-line">Things that are built break. Things that grow naturally return.</div>
</div>

</body>
</html>
